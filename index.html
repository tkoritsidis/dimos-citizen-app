<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Αναφορά Προβλήματος Δήμου</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        button { background-color: #0078d4; color: white; padding: 12px; border: none; width: 100%; border-radius: 5px; font-size: 16px; margin-top: 10px; }
        input[type="file"] { margin-top: 10px; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>📢 Αναφορά Προβλήματος Δήμου</h2>
    <p>Βγάλτε φωτογραφία το πρόβλημα (π.χ. μπάζα, εγκαταλελειμμένο όχημα).</p>

    <input type="file" id="photoInput" accept="image/*" capture="environment"><br>
    <button onclick="uploadReport()">Αποστολή Αναφοράς</button>

    <div id="status"></div>

    <script>
        async function uploadReport() {
            const fileInput = document.getElementById('photoInput');
            const status = document.getElementById('status');

            if (fileInput.files.length === 0) {
                status.innerText = "Παρακαλώ επιλέξτε ή βγάλτε μια φωτογραφία.";
                return;
            }

            status.innerText = "Λήψη τοποθεσίας GPS...";

            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                status.innerText = "Ανέβασμα φωτογραφίας...";

                const file = fileInput.files[0];
                const fileName = `report_${Date.now()}_lat${lat}_lon${lon}.jpg`;
                
                // Αντικαταστήστε με το δικό σας SAS URL ή Blob Endpoint
                const blobUrl = `https://stdimosreports.blob.core.windows.net/photos/${fileName}`;

                try {
                    const response = await fetch(blobUrl, {
                        method: 'PUT',
                        headers: {
                            'x-ms-blob-type': 'BlockBlob',
                            'Content-Type': file.type
                        },
                        body: file
                    });

                    if (response.ok) {
                        status.innerHTML = `<span style="color:green;">Η αναφορά στάλθηκε επιτυχώς!<br>GPS: ${lat}, ${lon}</span>`;
                    } else {
                        status.innerText = "Σφάλμα κατά την αποστολή.";
                    }
                } catch (err) {
                    status.innerText = "Σφάλμα δικτύου.";
                }
            }, (error) => {
                status.innerText = "Απαραίτητη η πρόσβαση στο GPS για την αποστολή.";
            });
        }
    </script>
</body>
</html>
